<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duck Warehouse</title><style>
body{font:16px system-ui,sans-serif;max-width:960px;margin:36px auto;padding:0 16px;color:#1e293b}h1{margin-bottom:8px}form{display:flex;gap:10px;flex-wrap:wrap;background:#f1f5f9;padding:16px;border-radius:8px}input,select,button{padding:8px;font:inherit}button{cursor:pointer;background:#0f766e;color:white;border:0;border-radius:4px}button.delete{background:#b91c1c}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px;border-bottom:1px solid #cbd5e1;text-align:left}.error{color:#b91c1c;min-height:24px}small{color:#475569}</style></head>
<body><h1>Duck Warehouse</h1><p><small>Adding an identical active duck increases its stock quantity.</small></p>
<form id="duck-form"><select name="color" required><option value="">Color</option><option>Red</option><option>Green</option><option>Yellow</option><option>Black</option></select><select name="size" required><option value="">Size</option><option>XLarge</option><option>Large</option><option>Medium</option><option>Small</option><option>XSmall</option></select><input name="price" type="number" min="0.01" step="0.01" placeholder="Price (USD)" required><input name="quantity" type="number" min="1" step="1" placeholder="Quantity" required><button>Add duck</button></form><p class="error" id="error"></p>
<table><thead><tr><th>ID</th><th>Color</th><th>Size</th><th>Price</th><th>Quantity</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const $=s=>document.querySelector(s), form=$('#duck-form'), error=$('#error');
async function request(url, options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw new Error((await r.json()).error||'Request failed');return r.status===204?null:r.json()}
async function load(){const ducks=await request('/api/ducks');$('#rows').innerHTML=ducks.map(d=>`<tr><td>${d.id}</td><td>${d.color}</td><td>${d.size}</td><td>$${Number(d.price).toFixed(2)}</td><td>${d.quantity}</td><td><button onclick="editDuck(${d.id},${d.price},${d.quantity})">Edit</button> <button class="delete" onclick="deleteDuck(${d.id})">Delete</button></td></tr>`).join('')}
form.onsubmit=async e=>{e.preventDefault();error.textContent='';const data=Object.fromEntries(new FormData(form));data.price=Number(data.price);data.quantity=Number(data.quantity);try{await request('/api/ducks',{method:'POST',body:JSON.stringify(data)});form.reset();load()}catch(e){error.textContent=e.message}};
async function editDuck(id,price,quantity){const nextPrice=prompt('Price (USD):',price),nextQuantity=prompt('Quantity:',quantity);if(nextPrice===null||nextQuantity===null)return;try{await request('/api/ducks/'+id,{method:'PUT',body:JSON.stringify({price:Number(nextPrice),quantity:Number(nextQuantity)})});load()}catch(e){error.textContent=e.message}}
async function deleteDuck(id){if(confirm('Logically delete this duck?')){try{await request('/api/ducks/'+id,{method:'DELETE'});load()}catch(e){error.textContent=e.message}}}
load().catch(e=>error.textContent=e.message);
</script></body></html>
